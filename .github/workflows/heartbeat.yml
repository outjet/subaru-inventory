name: Weekly Watch Heartbeat

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (~9am ET) — reassurance ping
  workflow_dispatch: {}

concurrency:
  group: outback-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send weekly watch summary
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python3 scripts/heartbeat.py --year 2026 --max-price 45000 --trims "Touring XT" "Limited XT"
