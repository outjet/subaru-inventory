name: BMV Title Watch

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6h — a dealer title posts in days to weeks
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bmv-title
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Ohio BMV title for the VIN
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          BMV_VIN: ${{ secrets.BMV_VIN }}
        run: python3 scripts/check_bmv_title.py

      - name: Commit state
        run: |
          FILES="data/bmv_title_state.json"
          if ! git diff --quiet -- $FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Update BMV title watch state"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs --autostash origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done
            exit 1
          else
            echo "No state change."
          fi
