name: Outback Touring XT Alert

on:
  schedule:
    - cron: "*/30 11-23,0-2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: outback-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch inventory once (shared by the alert + comps steps)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python3 scripts/fetch_cpo_inventory.py --zip 44107 --radius 300 --model OBK --out data/outback_data_200mi.json
          python3 scripts/add_drive_times.py --zip 44107 --radius 300

      - name: Check for new Touring XT listings under $45k
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python3 scripts/check_new_touring_xt.py --from-file data/outback_data_200mi.json

      - name: "Snapshot per-VIN history (days-on-lot, price drops, trend)"
        run: python3 scripts/snapshot_inventory.py --from-file data/outback_data_200mi.json --radius 300

      - name: Rebuild comps dashboard (GitHub Pages page in docs/)
        run: python3 scripts/build_dashboard.py

      - name: Commit updated state
        run: |
          FILES="data/seen_touring_xt_vins.json data/drive_times_cache.json data/outback_data_200mi.json data/inventory_history.json docs/index.html"
          if ! git diff --quiet -- $FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Update inventory history, comps trend, and dashboard"
            # Rebase onto any concurrent push before pushing, resolving conflicts
            # in these bot-generated files in favour of this run (the freshest
            # data). Retry, since another push can still land between pull & push.
            # Without this a raced push is silently dropped -- losing the seen
            # state and re-firing alerts every run.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase -X theirs --autostash origin main && git push; then
                echo "Pushed on attempt $attempt."; exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push raced (attempt $attempt) — retrying..."; sleep 5
            done
            echo "Could not push after retries; next run will retry."; exit 1
          else
            echo "No state change, skipping commit."
          fi
