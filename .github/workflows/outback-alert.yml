name: Outback Touring XT Alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: outback-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new Touring XT listings under $45k
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: python3 scripts/check_new_touring_xt.py

      - name: Commit updated state file
        run: |
          if ! git diff --quiet -- data/seen_touring_xt_vins.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/seen_touring_xt_vins.json
            git commit -m "Update seen Touring XT VINs"
            git push
          else
            echo "No state change, skipping commit."
          fi
